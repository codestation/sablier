name: Publish fork image

on:
  push:
    branches: [custom]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build binaries
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          BUILD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ctx="$RUNNER_TEMP/sablier-image"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          version="${GITHUB_SHA:0:12}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$BUILD_REF"; fi
          ldflags="-s -w -X github.com/sablierapp/sablier/pkg/version.Version=$version -X github.com/sablierapp/sablier/pkg/version.Revision=$GITHUB_SHA -X github.com/sablierapp/sablier/pkg/version.Branch=$BUILD_REF -X github.com/sablierapp/sablier/pkg/version.BuildDate=$build_date -X github.com/sablierapp/sablier/pkg/version.BuildUser=github-actions"
          for arch in amd64 arm64 arm; do
            platform="linux/$arch"
            if [ "$arch" = arm ]; then platform="linux/arm/v7"; fi
            mkdir -p "$ctx/$platform"
            GOARCH="$arch" GOARM=7 go build -trimpath -tags=nomsgpack \
              -ldflags "$ldflags" -o "$ctx/$platform/sablier" ./cmd/sablier
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUILD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(--tag "$image:sha-${GITHUB_SHA:0:12}")
          if [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            tags+=(--tag "$image:latest")
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags+=(--tag "$image:$BUILD_REF")
          fi
          docker buildx build --push \
            --platform linux/amd64,linux/arm64,linux/arm/v7 \
            --file build/Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            "${tags[@]}" "$RUNNER_TEMP/sablier-image"
          {
            echo '## Published image'
            printf '\n`%s:sha-%s`\n' "$image" "${GITHUB_SHA:0:12}"
          } >> "$GITHUB_STEP_SUMMARY"
